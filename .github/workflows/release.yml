name: Publish catalog

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Create checksums
        run: |
          sha256sum catalog.json > catalog.json.sha256
          sha256sum catalog-v2.json > catalog-v2.json.sha256
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            catalog.json
            catalog.json.sha256
            catalog-v2.json
            catalog-v2.json.sha256
